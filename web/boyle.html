<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemViz AI — 보일의 법칙</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
    <script src="https://unpkg.com/@vernier/godirect/dist/godirect.min.umd.js" defer></script>
    <script src="js/simulation.js" defer></script>
    <script src="js/renderer.js" defer></script>
    <script src="js/protocol.js" defer></script>
    <script src="js/serial.js" defer></script>
    <script src="js/vernier.js" defer></script>
    <script src="js/logger.js" defer></script>
    <script src="js/tutor.js" defer></script>
    <script src="js/tutor-report-boyle.js" defer></script>
    <script src="js/ai-tutor.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body data-page="boyle">
    <nav class="page-nav">
        <a href="index.html" class="nav-home" title="홈으로 돌아가기">🏠 홈으로</a>
    </nav>
    <div id="basic-mode">
    <main id="main-container" class="main-area">
        <section id="section-controls">
            <div id="sensor-panel">
                <div id="sensor-mode-toggle">
                    <button id="btn-mode-mock" class="active">🖥 시뮬레이션</button>
                    <button id="btn-mode-ws">🔌 에뮬레이터</button>
                    <button id="btn-mode-real">⚡ 실센서</button>
                    <button id="btn-mode-vernier">📡 Vernier</button>
                </div>
                <div id="sensor-real-controls" class="hidden">
                    <button id="btn-serial-connect">🔌 포트 연결</button>
                    <button id="btn-serial-disconnect" class="hidden">✖ 연결 해제</button>
                    <span id="serial-status">연결 안 됨</span>
                    <span id="serial-sensor-label"></span>
                    <button id="btn-serial-calib" disabled>🎯 영점 캘리브</button>
                </div>
                <div id="sensor-vernier-controls" class="hidden">
                    <button id="btn-vernier-connect">📡 Vernier 연결</button>
                    <button id="btn-vernier-disconnect" class="hidden">✖ 연결 해제</button>
                    <span id="vernier-status">연결 안 됨</span>
                    <span id="vernier-sensor-label"></span>
                </div>
                <div id="sensor-ws-controls" class="hidden">
                    <span id="ws-status">연결 중...</span>
                    <span id="ws-sensor-label"></span>
                    <button id="btn-ws-calib" disabled>🎯 영점 캘리브</button>
                </div>
                <div id="serial-error" class="sensor-error"></div>
            </div>
            <div id="volume-input-reminder" class="volume-reminder hidden">
                📏 시린지 눈금을 확인하고 V(mL)를 직접 입력하세요
            </div>
            <div class="control-row control-row-temperature"></div>
            <div class="control-row control-row-actuators"></div>
            <div class="control-row-playback">
                <span class="playback-label">재생 속도:</span>
                <div class="playback-btn-group">
                    <button class="playback-btn" data-speed="0.25">0.25x</button>
                    <button class="playback-btn" data-speed="0.5">0.5x</button>
                    <button class="playback-btn active" data-speed="1">1x</button>
                </div>
                <button class="pause-btn" id="btn-pause">⏸</button>
            </div>
        </section>
        <section id="section-canvas"></section>
        <section id="section-visuals">
            <div id="histogram-area"></div>
            <div id="info-panel-area"></div>
        </section>
        <section id="section-measurements"></section>
        <section id="section-analysis" class="hidden"></section>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("btn-ai-collapse")?.addEventListener("click", () => {
          document.body.classList.toggle("sidebar-collapsed");
        });
        document.getElementById("ai-reopen-btn")?.addEventListener("click", () => {
          document.body.classList.remove("sidebar-collapsed");
        });
      });
    </script>
    <aside id="ai-sidebar" class="ai-sidebar">
        <header class="sidebar-header">
            <h2>🤖 AI 튜터</h2>
            <div class="header-actions">
                <button id="btn-toggle-settings" title="설정" aria-label="설정 토글" class="icon-btn">⚙</button>
                <button id="btn-ai-collapse" title="사이드바 접기" aria-label="사이드바 접기" class="icon-btn">×</button>
            </div>
        </header>
        <div id="ai-settings-panel" class="settings-panel">
            <div class="api-key-hint">
                🔑 API 키는 <a href="index.html">🏠 홈</a> 에서 설정합니다.
            </div>
            <div class="options-row">
                <label>학생 수준
                    <select id="ai-student-level">
                        <option value="elem">초등학생</option>
                        <option value="middle">중학생</option>
                        <option value="high" selected>고등학생</option>
                        <option value="univ">대학생</option>
                    </select>
                </label>
                <label>모델
                    <select id="ai-model">
                        <option value="claude-sonnet-4-6" selected>Sonnet</option>
                        <option value="claude-opus-4-7">Opus</option>
                    </select>
                </label>
            </div>
            <div class="usage-display">
                이번 세션 사용량:
                <span id="tokens-used">0</span> 토큰
                (약 <span id="cost-estimate">0</span>원)
            </div>
        </div>
        <div class="sidebar-body">
            <nav class="question-tabs">
                <button class="tab-btn active" data-q="1">
                    <span>Q1</span>
                    <span class="tab-reset" data-reset-q="1" title="이 탭 대화 초기화" aria-label="Q1 초기화">↺</span>
                </button>
                <button class="tab-btn" data-q="2">
                    <span>Q2</span>
                    <span class="tab-reset" data-reset-q="2" title="이 탭 대화 초기화" aria-label="Q2 초기화">↺</span>
                </button>
                <button class="tab-btn" data-q="3">
                    <span>Q3</span>
                    <span class="tab-reset" data-reset-q="3" title="이 탭 대화 초기화" aria-label="Q3 초기화">↺</span>
                </button>
                <button class="tab-btn" data-q="4" aria-disabled="true">
                    <span>Q4</span>
                    <span class="tab-reset" data-reset-q="4" title="이 탭 대화 초기화" aria-label="Q4 초기화">↺</span>
                </button>
                <button class="tab-btn tab-btn-free" data-q="free">
                    <span>💬 자유</span>
                    <span class="tab-reset" data-reset-q="free" title="이 탭 대화 초기화" aria-label="자유 초기화">↺</span>
                </button>
            </nav>
            <div class="question-context" id="question-context">
                <small>현재 대화 주제:</small>
                <p class="question-snippet" id="question-snippet"></p>
            </div>
            <div class="conversation-scroll" id="conversation-scroll">
                <div class="empty-state" id="conversation-empty">
                    아직 대화가 없습니다.<br>
                    왼쪽에서 [대화 시작]을 눌러주세요.
                </div>
                <div class="messages-list" id="messages-list"></div>
            </div>
        </div>
        <div id="conversation-end-controls" class="conversation-end-controls" hidden>
            <button id="btn-close-q" type="button" title="이 탭의 탐구를 마무리하고 요약받기">✓ 대화 마무리</button>
        </div>
        <div class="message-input-area">
            <textarea id="message-input"
                      placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)"
                      rows="2" disabled></textarea>
            <button id="btn-send-message" title="전송" disabled>↑</button>
        </div>
    </aside>
    <button id="ai-reopen-btn" title="AI 튜터 열기">💬</button>
    </div>
</body>
</html>
